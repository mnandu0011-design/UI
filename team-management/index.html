
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Management - SaaSify</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <a href="../index.html" class="brand">SaaS<span>ify</span></a>
           
        </div>

        <div class="profile">MN</div>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Page Title -->
        <div class="title">
            <div>
                <p>WORKSPACE</p>
                <h1>Team management</h1>
                <span>Manage members, roles and access.</span>
            </div>

            <button type="button" id="inviteBtn">
                + Invite member
            </button>
        </div>

        <!-- Search and Role Filter -->
        <section class="toolbar">
            <input
                type="search"
                id="search"
                placeholder="⌕ Search members..."
                aria-label="Search team members"
            >

            <select id="roleFilter" aria-label="Filter by role">
                <option value="All">All roles</option>
                <option value="Admin">Admin</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="Member">Member</option>
            </select>
        </section>

        <!-- Team Members Table -->
        <section class="table" aria-label="Team members">

            <div class="thead">
                <span>Member</span>
                <span>Role</span>
                <span>Status</span>
                <span>Action</span>
            </div>

            <!-- JavaScript inserts team members here -->
            <div id="rows"></div>

        </section>

    </main>

    <!-- Invite Member Modal -->
    <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >
        <div class="box">

            <button
                type="button"
                class="close"
                id="close"
                aria-label="Close invitation form"
            >
                &times;
            </button>

            <h2 id="modalTitle">Invite team member</h2>

            <input
                type="text"
                id="name"
                placeholder="Full name"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <select id="newRole" aria-label="Select member role">
                <option value="Member">Member</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="Admin">Admin</option>
            </select>

            <button type="button" id="add">
                Send invitation
            </button>

        </div>
    </div>

    <!-- Notification Message -->
    <div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
